[package]
name = "paclang"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Inspect programming-language analysis for installed ALPM packages"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
toon-format = { version = "=0.5.0", default-features = false }

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
proptest = "1.7.0"
tempfile = "3.21.0"
