[package]
name = "paclang"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Inspect programming-language analysis for installed ALPM packages"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.47", features = ["derive", "env"] }
curl = "0.4.50"
fs2 = "0.4.3"
httpdate = "1.0.3"
flate2 = "1"
tar = "0.4"
nix = { version = "0.30.1", features = ["signal"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
git2 = { version = "0.20.4", default-features = false, features = ["https"] }
tempfile = "3.21.0"
signal-hook = "0.3.18"
toon-format = { version = "=0.5.0", default-features = false }
url = "2.5.7"

[dev-dependencies]
nix = { version = "0.30.1", features = ["term"] }
proptest = "1.7.0"
tempfile = "3.21.0"
